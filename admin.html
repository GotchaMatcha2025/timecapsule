<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Time Capsule</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d0d0d;
      color: #f0f0f0;
      min-height: 100dvh;
    }

    /* ── Login ── */
    #login-screen {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100dvh; padding: 40px 24px;
    }
    .brand-title { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.1em; color: #fff; margin-bottom: 4px; }
    .brand-sub   { font-size: 0.8rem; color: #444; letter-spacing: 0.06em; margin-bottom: 40px; }
    #login-box   { width: 100%; max-width: 320px; }
    #login-box input {
      width: 100%; padding: 15px 16px;
      background: #151515; border: 1px solid #222; border-radius: 12px;
      color: #f0f0f0; font-size: 1rem; margin-bottom: 10px;
      outline: none; -webkit-appearance: none;
    }
    #login-box input:focus { border-color: #444; }
    #login-btn {
      width: 100%; padding: 15px;
      background: #c0392b; border: none; border-radius: 12px;
      color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    #login-err { color: #e74c3c; font-size: 0.82rem; margin-top: 10px; text-align: center; min-height: 18px; }

    /* ── Dashboard ── */
    #dashboard { display: none; max-width: 700px; margin: 0 auto; padding: 36px 24px 60px; }

    .dash-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 36px;
    }
    .dash-title { font-size: 0.78rem; letter-spacing: 0.12em; color: #444; text-transform: uppercase; }
    .dash-live   { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #555; }
    .live-dot    { width: 7px; height: 7px; background: #c0392b; border-radius: 50%; animation: blink 1.4s step-start infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    #last-updated { font-size: 0.75rem; color: #333; }

    /* ── Stat grid ── */
    .section-label {
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: #333; margin-bottom: 12px; margin-top: 28px;
    }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .stat-card {
      background: #111; border: 1px solid #1c1c1c; border-radius: 16px;
      padding: 22px 20px 20px;
    }
    .stat-label { font-size: 0.72rem; color: #444; letter-spacing: 0.07em; text-transform: uppercase; margin-bottom: 10px; }
    .stat-big   { font-size: 3rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; color: #fff; }
    .stat-big.accent { color: #c0392b; }
    .stat-sub   { font-size: 0.78rem; color: #333; margin-top: 6px; }

    /* ── Storage bar ── */
    .storage-card {
      background: #111; border: 1px solid #1c1c1c; border-radius: 16px;
      padding: 22px 20px 20px; margin-top: 12px;
    }
    .storage-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
    .storage-used   { font-size: 1.6rem; font-weight: 700; color: #fff; }
    .storage-limit  { font-size: 0.78rem; color: #333; }
    .bar-track { height: 6px; background: #1c1c1c; border-radius: 3px; overflow: hidden; }
    .bar-fill  { height: 100%; border-radius: 3px; background: #c0392b; transition: width 0.6s ease; }
    .bar-fill.ok     { background: #27ae60; }
    .bar-fill.warn   { background: #f39c12; }
    .bar-fill.danger { background: #c0392b; }
    .storage-note { font-size: 0.72rem; color: #333; margin-top: 8px; }

    /* ── Refresh ── */
    #refresh-btn {
      background: none; border: 1px solid #1c1c1c; border-radius: 9px;
      color: #333; font-size: 0.8rem; padding: 7px 13px; cursor: pointer;
      transition: all 0.15s;
    }
    #refresh-btn:hover { border-color: #333; color: #888; }

    /* ── Error banner ── */
    #error-banner {
      display: none; background: rgba(192,57,43,0.12); border: 1px solid rgba(192,57,43,0.3);
      border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
      font-size: 0.82rem; color: #e74c3c; line-height: 1.5;
    }
  </style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="brand-title">⏱ TIME CAPSULE</div>
  <div class="brand-sub">STAFF DASHBOARD · GOTCHA MATCHA</div>
  <div id="login-box">
    <input type="password" id="pw-input" placeholder="Staff password" autocomplete="current-password">
    <button id="login-btn" onclick="doLogin()">Enter →</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- ── Dashboard ── -->
<div id="dashboard">
  <div class="dash-header">
    <div class="dash-title">TIME CAPSULE · ADMIN</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <button id="refresh-btn" onclick="loadStats()">↻ Refresh</button>
      <div class="dash-live"><div class="live-dot"></div> Live</div>
    </div>
  </div>

  <div id="error-banner"></div>

  <!-- Link clicks -->
  <div class="section-label">Link Clicks</div>
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">Today</div>
      <div class="stat-big accent" id="clicks-today">—</div>
      <div class="stat-sub">people opened the link</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">All Time</div>
      <div class="stat-big" id="clicks-total">—</div>
      <div class="stat-sub">total opens</div>
    </div>
  </div>

  <!-- Uploads -->
  <div class="section-label">Capsules Recorded</div>
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">Today</div>
      <div class="stat-big accent" id="uploads-today">—</div>
      <div class="stat-sub">videos saved today</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">All Time</div>
      <div class="stat-big" id="uploads-total">—</div>
      <div class="stat-sub">capsules sealed</div>
    </div>
  </div>

  <!-- Storage -->
  <div class="section-label">Storage</div>
  <div class="storage-card">
    <div class="storage-header">
      <div class="storage-used"><span id="storage-used">—</span></div>
      <div class="storage-limit">of 100 GB available</div>
    </div>
    <div class="bar-track">
      <div class="bar-fill ok" id="storage-bar" style="width:0%"></div>
    </div>
    <div class="storage-note" id="storage-note">Estimated at ~4 MB per video</div>
  </div>

  <div id="last-updated" style="margin-top:20px;text-align:right;"></div>
</div>

<script>
  var SUPABASE_URL   = 'https://tbkfwemzrurbdjapxyhm.supabase.co';
  var SUPABASE_KEY   = 'sb_publishable_oLhnjVpyOdwGkYR9weW4NA_ihhbOxga';
  var ADMIN_PASSWORD = 'matcha2026';
  var STORAGE_LIMIT_GB = 100; // Supabase Pro storage limit

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ── Auth ─────────────────────────────────────────────
  function doLogin() {
    if (document.getElementById('pw-input').value === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display    = 'block';
      loadStats();
    } else {
      document.getElementById('login-err').textContent = 'Incorrect password.';
      document.getElementById('pw-input').value = '';
    }
  }
  document.getElementById('pw-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });

  // ── Load stats ────────────────────────────────────────
  function loadStats() {
    // Reset to loading state
    ['clicks-today','clicks-total','uploads-today','uploads-total'].forEach(function(id) {
      document.getElementById(id).textContent = '…';
    });
    document.getElementById('error-banner').style.display = 'none';

    var todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);
    var todayISO = todayStart.toISOString();

    // Run all 4 queries in parallel
    Promise.all([
      // Total clicks
      sb.from('visits').select('*', { count: 'exact', head: true }),
      // Today's clicks
      sb.from('visits').select('*', { count: 'exact', head: true }).gte('visited_at', todayISO),
      // Total uploads
      sb.from('capsules').select('*', { count: 'exact', head: true }),
      // Today's uploads
      sb.from('capsules').select('*', { count: 'exact', head: true }).gte('created_at', todayISO)
    ]).then(function(results) {
      var errors = results.filter(function(r) { return r.error; });
      if (errors.length > 0) {
        showError(errors[0].error.message);
        return;
      }

      var clicksTotal  = results[0].count || 0;
      var clicksToday  = results[1].count || 0;
      var uploadsTotal = results[2].count || 0;
      var uploadsToday = results[3].count || 0;

      document.getElementById('clicks-total').textContent  = clicksTotal;
      document.getElementById('clicks-today').textContent  = clicksToday;
      document.getElementById('uploads-total').textContent = uploadsTotal;
      document.getElementById('uploads-today').textContent = uploadsToday;

      // Storage estimate
      var usedMB  = uploadsTotal * 4;
      var usedGB  = usedMB / 1024;
      var pct     = Math.min(100, (usedGB / STORAGE_LIMIT_GB) * 100);
      var bar     = document.getElementById('storage-bar');
      var display = usedMB >= 1024 ? usedGB.toFixed(2) + ' GB' : usedMB + ' MB';

      document.getElementById('storage-used').textContent = display;
      bar.style.width = pct.toFixed(1) + '%';
      bar.className   = 'bar-fill ' + (pct > 80 ? 'danger' : pct > 50 ? 'warn' : 'ok');
      document.getElementById('storage-note').textContent =
        'Est. ' + display + ' used · ~4 MB per video · ' + (STORAGE_LIMIT_GB - usedGB).toFixed(1) + ' GB remaining';

      // Timestamp
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-SG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    }).catch(function(err) {
      showError(err.message || 'Failed to load stats.');
    });
  }

  function showError(msg) {
    var b = document.getElementById('error-banner');
    b.textContent = '⚠ ' + msg + ' — Make sure the Supabase SQL policies are in place.';
    b.style.display = 'block';
    ['clicks-today','clicks-total','uploads-today','uploads-total'].forEach(function(id) {
      document.getElementById(id).textContent = '—';
    });
  }

  // Auto-refresh every 60 seconds
  setInterval(function() {
    if (document.getElementById('dashboard').style.display !== 'none') loadStats();
  }, 60000);
</script>
</body>
</html>
